trigger:
- main
- develop

# for sensitive information like API tokens or passwords, 
# it's highly recommended to use secret variables.
# You define these in the Azure Pipelines UI (Pipeline settings -> Variables) 
# and they are securely stored and masked in the logs.
# In your YAML, you can reference them like regular variables using the $(variable-name) syntax.

variables:
  RESOURCE_GROUP_NAME: 'your-resource-group-name'
  DATABRICKS_WORKSPACE_NAME: 'your-databricks-workspace-name'
  SUBSCRIPTION_ID: 'your-azure-subscription-id'
  DATABRICKS_HOST: 'https://your-workspace.azuredatabricks.net'
  DATABRICKS_TOKEN: '$(databricksToken)' # 'databricksToken' would be defined as a secret variable in the UI

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Use Python 3.x'

- task: PipToolInstaller@0
  inputs:
    versionSpec: 'latest'
  displayName: 'Install Pip'

- task: Pip@0
  inputs:
    pipPackage: '-r requirements.txt'
  displayName: 'Install Python Dependencies'

- task: PythonTestRunner@0
  inputs:
    testWorkingDirectory: 'tests/' 
    pytestArgs: ''
    resultsFile: 'test-results.xml'
  displayName: 'Run Pytest Integration Tests'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'pytest'
    testResultsFiles: 'test-results.xml'
    publishRunAttachments: true
  condition: succeededOrFailed()
  displayName: 'Publish Test Results'